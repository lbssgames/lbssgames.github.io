<!DOCTYPE html>
<html>
<head>
    <script>
        window.addEventListener("load", () => {
            open("about:blank", "_blank")
        });
      </script>
    <title>Just a Cool Website</title>
    <link rel="icon" type="image/x-icon" href="/icons/justACoolLogo.ico">
    <style>
        body {
            background: linear-gradient(90deg, rgba(42,38,108,1) 0%, rgba(21,20,77,1) 12%, rgba(66,66,172,1) 53%, rgba(48,48,115,1) 79%, rgba(51,51,148,1) 91%);
        }
        .center {
            display: block;
            margin-left: auto;
            margin-right: auto;
            margin-top: 10px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            grid-gap: 20px;
            margin-top: 10px;
        }

        .game-card {
            background: radial-gradient(circle, rgba(238,215,174,1) 0%, rgba(196,148,233,1) 100%);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .game-icon {
            width: 100px;
            height: 100px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .game-title {
            font-size: 18px;
            font-weight: bold;
        }

        .game-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .game-button:hover {
            background-color: #2980b9;
        }
        }
    </style>
</head>
<body>
    <img src="justACoolBanner.png" alt="Banner" class="center">
    <div class="grid-container" id="game-grid"></div>
    <script type = "text/javascript" src="gamecards.js"></script>
</body>
</html>
