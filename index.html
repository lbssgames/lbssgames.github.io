<!DOCTYPE html>
<html>
<head>
    <title>Just a Cool Website</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        body {
            background-color: blue;
        }
        .center {
            display: block;
            margin-left: auto;
            margin-right: auto;
            margin-top: 10px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            grid-gap: 20px;
            margin-top: 10px;
        }

        .game-card {
            background-color: cyan;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .game-icon {
            width: 100px;
            height: 100px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .game-title {
            font-size: 18px;
            font-weight: bold;
        }

        .game-link {
            color: #0066cc;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <img src="justACoolBanner.png" alt="Banner" class="center">
    <div class="grid-container" id="game-grid"></div>

<!--     <script src="/games.json"></script> -->
    <script type = "text/javascript" src="gamecards.js"></script>
</body>
</html>
