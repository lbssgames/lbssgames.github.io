<!DOCTYPE html>
<html>
<head>
    <title>Just a Cool Website</title>
    <link rel="icon" type="image/x-icon" href="/icons/justACoolLogo.ico">
    <style>
        body {
            background: linear-gradient(90deg, rgba(42,38,108,1) 0%, rgba(21,20,77,1) 12%, rgba(66,66,172,1) 53%, rgba(48,48,115,1) 79%, rgba(51,51,148,1) 91%);
        }
        .center {
            display: block;
            margin-left: auto;
            margin-right: auto;
            margin-top: 10px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            grid-gap: 20px;
            margin-top: 10px;
        }

        .game-card {
            background-color: linear-gradient(270deg, rgba(72,71,87,1) 0%, rgba(54,53,74,1) 12%, rgba(75,75,88,1) 53%, rgba(75,75,82,1) 79%, rgba(72,72,82,1) 91%);;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .game-icon {
            width: 100px;
            height: 100px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .game-title {
            font-size: 18px;
            font-weight: bold;
        }

        .game-link {
            color: #0066cc;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <img src="justACoolBanner.png" alt="Banner" class="center">
    <div class="grid-container" id="game-grid"></div>
    <script type = "text/javascript" src="gamecards.js"></script>
</body>
</html>
